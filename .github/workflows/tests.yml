name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint Phase 2.2 modules
        run: ruff check --select E4,E7,E9,F app/api/validation.py app/domain/sensitivity.py app/infrastructure/validation_store.py app/services/live_validation.py tests/test_validation_phase22.py
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test suite
        run: pytest -q
