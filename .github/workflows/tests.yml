name: Python tests

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main, 'audit/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint entire repository
        run: ruff check --select E4,E7,E9,F --ignore E701,E702 app tests
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test suite
        run: pytest -q
